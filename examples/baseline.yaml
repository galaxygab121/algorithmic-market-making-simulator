# Baseline scenario: calm GBM market, default liquidity. All results are SIMULATED.
name: baseline
seed: 42
steps: 3000          # 3000 x 100 ms = 5 simulated minutes
step_ms: 100
market:
  initial_price: 100.0
  process: gbm
  volatility: 0.0002        # relative std per sqrt(second)
  drift_per_sec: 0.0
  lp_arrival_rate: 3.0
  market_order_rate: 0.5
  informed_fraction: 0.15
  regimes:
    - {regime: baseline, start_frac: 0.0, end_frac: 1.0}
exchange:
  tick_size: 0.01
  contract_multiplier: 10   # tick_value = 0.10 per unit
  fees: {maker_fee_bps: -0.2, taker_fee_bps: 0.5}
  order_latency_ms: 20
  cancel_latency_ms: 20
risk:
  position_limit: 100
  max_order_qty: 20
  max_notional: 100000
  max_drawdown: 100
strategies:
  baseline:
    quote_size: 5
    max_inventory: 50
    half_spread_ticks: 2
  inventory_aware:
    quote_size: 5
    max_inventory: 50
    gamma: 0.01
    horizon_sec: 10
    k: 1.5
    max_spread_ticks: 20
